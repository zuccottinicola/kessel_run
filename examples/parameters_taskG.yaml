detection:
  dataset_path: "../datasets/tess_data.csv"

  n_bins: 1000
  use_scaler: false
  samples_per_class: 350

  random_forest:
    n_estimators: 100
    max_depth: 10
    min_samples_leaf: 1
    max_features: "sqrt"
    bootstrap: true
    class_weight: null
    random_state: 42
    n_jobs: -1
    oob_score: true